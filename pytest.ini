[pytest]
testpaths = tests
# The QE integration tests really run pw.x, so they are opt-in: `pytest -m qe`
# for just those, `pytest -m ""` for everything.
addopts = --strict-markers -m "not qe"
markers =
    qe: end-to-end test that runs Quantum Espresso (needs pw.x + mpirun on PATH)
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*zero total energy.*
